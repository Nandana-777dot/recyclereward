<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>EcoQuest - Start Your Journey</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind config -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary":          "#2ecc70",
            "accent-yellow":    "#f1c40f",
            "quest-purple":     "#9b59b6",
            "background-light": "#f6f8f7",
            "background-dark":  "#121212",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg":      "0.5rem",
            "xl":      "0.75rem",
            "2xl":     "1.5rem",
            "full":    "9999px"
          },
        },
      },
    }
  </script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="start.css"/>
</head>

<body class="bg-background-dark text-slate-100 font-display overflow-hidden">
<div class="relative min-h-screen w-full flex flex-col hero-gradient">

  <!-- ── Background decorative icons ─────────────────────────────────────── -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-20" aria-hidden="true">
    <span class="material-symbols-outlined absolute text-[120px] text-primary/20 top-[10%] left-[5%] rotate-12">energy_savings_leaf</span>
    <span class="material-symbols-outlined absolute text-[80px] text-accent-yellow/10 bottom-[15%] left-[10%] -rotate-12">eco</span>
    <span class="material-symbols-outlined absolute text-[150px] text-primary/10 top-[40%] right-[-5%] rotate-45">recycling</span>
    <span class="material-symbols-outlined absolute text-[60px] text-quest-purple/20 bottom-[10%] right-[15%]">forest</span>
  </div>

  <!-- ── HEADER ─────────────────────────────────────────────────────────── -->
  <header class="relative z-10 flex items-center justify-center p-8">
    <div class="flex items-center gap-2">
      <div class="bg-primary/20 p-2 rounded-lg">
        <span class="material-symbols-outlined text-primary text-3xl">energy_savings_leaf</span>
      </div>
      <span class="text-2xl font-bold tracking-tight text-white">EcoQuest</span>
    </div>
  </header>

  <!-- ── MAIN ───────────────────────────────────────────────────────────── -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 text-center max-w-lg mx-auto">

    <!-- Illustration -->
    <div class="mb-8 relative">
      <div class="absolute -inset-4 bg-primary/20 blur-3xl rounded-full opacity-30"></div>
      <div class="relative glass-card p-6 rounded-2xl inline-block mb-6">
        <img
          alt="A small green sprout growing from soil in hands"
          class="w-32 h-32 object-cover rounded-xl shadow-2xl"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTmrLGPUT4J9RQQHDicQYK_rpCs9DpRNPyhlRLCvXpDFXvw7bJtVKG6BQHZb_t6WoP-iqm_ez2eRCK0kUvXlYO1jmHp4saC1bAcy7Oa0X0ocs01XIdflsXJDL_k4vlrxe3Sb9Evyk4unv0zYgWwNHMxUXahkNqtmrVwNqymIEP9eWMXatdDRfnvahXLSa-mBnkT_lpo05nbgk1eoS3GX-k2UpgPSX3yc1I5H_k7c3aFqI0mVH0cktY26NFF__8wQQ8jUQ4ZwsYeP8"
        />
      </div>
    </div>

    <!-- Heading -->
    <h1 class="text-4xl md:text-5xl font-extrabold text-white leading-[1.1] mb-4 tracking-tight">
      Welcome to your <span class="text-primary">recycling journey</span>
    </h1>

    <!-- Subtext -->
    <p class="text-slate-400 text-lg md:text-xl font-normal leading-relaxed mb-10 max-w-sm">
      Every action counts. Let's make the planet greener together.
    </p>

    <!-- CTA -->
    <div class="w-full flex flex-col gap-4">
      <button
        id="startBtn"
        class="w-full bg-quest-purple hover:bg-quest-purple/90 text-white font-bold py-5 px-8 rounded-xl text-xl shadow-lg shadow-quest-purple/20 transition-all transform hover:scale-[1.02] active:scale-[0.98]"
      >
        Start My Quest
      </button>
      <p class="text-slate-500 text-sm font-medium uppercase tracking-widest">
        Join 50k+ Eco-Warriors
      </p>
    </div>

  </main>

  <!-- ── FOOTER / BOTTOM NAV ────────────────────────────────────────────── -->
  <footer class="relative z-10 mt-auto">
    <div class="flex gap-2 border-t border-white/5 bg-white/5 backdrop-blur-md px-4 pb-8 pt-4">
      <a href="#" class="nav-link flex flex-1 flex-col items-center justify-center gap-1 rounded-xl text-primary">
        <span class="material-symbols-outlined text-[28px]">home</span>
        <span class="text-[10px] font-bold uppercase tracking-tighter">Home</span>
      </a>
      <a href="#" class="nav-link flex flex-1 flex-col items-center justify-center gap-1 text-slate-400">
        <span class="material-symbols-outlined text-[28px]">emoji_events</span>
        <span class="text-[10px] font-bold uppercase tracking-tighter">Leaderboard</span>
      </a>
      <a href="#" class="nav-link flex flex-1 flex-col items-center justify-center gap-1 text-slate-400">
        <span class="material-symbols-outlined text-[28px]">recycling</span>
        <span class="text-[10px] font-bold uppercase tracking-tighter">Log Action</span>
      </a>
      <a href="#" class="nav-link flex flex-1 flex-col items-center justify-center gap-1 text-slate-400">
        <span class="material-symbols-outlined text-[28px]">account_circle</span>
        <span class="text-[10px] font-bold uppercase tracking-tighter">Profile</span>
      </a>
    </div>
  </footer>

  <!-- Bottom accent bar -->
  <div class="h-2 bg-primary w-full"></div>

</div>

<!-- JavaScript -->
<script src="start.js"></script>
</body>
</html>
